<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">

  <body>
    <section id="authGate" class="auth-gate">
      <div class="auth-card">
        <div class="brand auth-brand">
          <div class="brand-mark"><img src="canelilloIcon.png" alt="Logo Canelillo" onerror="this.style.display='none'; this.parentElement.classList.add('logo-fallback');"></div>
          <div>
            <strong>Canelillo AgroCore</strong>
            <span>Supabase · aplicaciones y bodega</span>
          </div>
        </div>
        <div class="auth-tabs">
          <button type="button" class="active" data-action="gate-tab" data-tab="login">Ingresar</button>
          <button type="button" data-action="gate-tab" data-tab="register">Registrar</button>
        </div>
        <div id="gateStatus" class="auth-status" role="status" aria-live="polite"></div>
        <form id="gateLoginForm" class="auth-pane active-auth-pane">
          <label>Correo<input name="email" type="email" autocomplete="email" required></label>
          <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
          <button class="primary-button" type="button" id="gateLoginButton">Entrar</button>
          <button class="link-button" type="button" data-action="gate-tab" data-tab="recover">Recuperar contraseÃ±a</button>
        </form>
        <form id="gateRecoverForm" class="auth-pane">
          <label>Correo<input name="recoverEmail" type="email" autocomplete="email" required></label>
          <div class="auth-inline-actions">
            <button class="secondary-button" type="button" data-action="gate-tab" data-tab="login">Volver</button>
            <button class="primary-button" type="button" id="gateRecoverButton">Enviar enlace</button>
          </div>
        </form>
        <form id="gateResetPasswordForm" class="auth-pane">
          <label>Nueva contraseÃ±a<input name="newPassword" type="password" autocomplete="new-password" required></label>
          <label>Repetir contraseÃ±a<input name="newPassword2" type="password" autocomplete="new-password" required></label>
          <button class="primary-button" type="button" id="gateResetPasswordButton">Guardar contraseÃ±a</button>
        </form>
        <form id="gateRegisterForm" class="auth-pane">
          <div class="form-grid">
            <label>Nombre completo<input name="fullName" autocomplete="name" required></label>
            <label>RUT<input name="rut" placeholder="12.345.678-9" required></label>
            <label>Rol<select name="role"><option value="bodeguero">Bodeguero</option><option value="supervisor">Supervisor</option><option value="admin">Admin</option></select></label>
            <label>Area/App<select name="area"><option value="todas">Todas las apps</option><option value="agrocore">AgroCore</option><option value="cosecha">Cosecha</option><option value="calicatas">Calicatas</option><option value="riego">Riego</option><option value="fertilizacion">Fertilizacion</option></select></label>
            <label>Codigo de registro<input name="inviteCode" autocomplete="one-time-code" required></label>
            <label class="full">Correo<input name="registerEmail" type="email" autocomplete="email" required></label>
            <label>Contraseña<input name="registerPassword" type="password" autocomplete="new-password" required></label>
            <label>Repetir contraseña<input name="registerPassword2" type="password" autocomplete="new-password" required></label>
          </div>
          <button class="primary-button" type="button" id="gateRegisterButton">Crear cuenta</button>
        </form>
        <div class="auth-privacy">
          <a class="link-button" href="privacidad.html" target="_blank" rel="noopener">Politicas de privacidad</a>
          <span>Uso de datos en AgroCore y aplicaciones vinculadas.</span>
        </div>
      </div>
    </section>

            <button class="nav-item" data-view="program" title="Programa"><span class="nav-label">Programa</span></button>

            <button class="nav-item" data-view="warehouse" title="Bodega"><span class="nav-label">Bodega</span></button>

            <button class="nav-item" data-view="harvestExport" title="Exportacion"><span class="nav-label">Exportacion</span></button>

          <a class="sidebar-privacy-link" href="privacidad.html" target="_blank" rel="noopener">Politicas de privacidad</a>
        </div>

        <div class="top-actions">
            <div class="user-menu" id="userMenu">
              <button id="authButton" class="user-chip" type="button" aria-haspopup="menu" aria-expanded="false">
                <span class="user-avatar" data-user-avatar aria-hidden="true">AC</span>
                <span class="user-chip-copy"><strong data-user-name>Cuenta</strong><small data-user-role>Usuario</small></span>

        <section id="dashboard" class="view active-view"></section>
